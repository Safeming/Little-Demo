# @package _global_

best_metric: psnr_fg

opt:
  iterations: 20000
  grad_clip: 0.1

  feature_lr: 9e-4
  pose_correction_lr: 0.0001
  non_rigid_lr: 9e-4

  lambda_l1: 1.0
  lambda_dssim: [0.0, 3000, 0.01]
  lambda_l1_fg: [0.14, 4000, 0.20, 9000, 0.22]
  lambda_l1_boundary: [0.0, 5000, 0.05, 9000, 0.08]
  lambda_l1_face: [0.0, 3000, 0.08, 7000, 0.12]
  lambda_perceptual_face: [0.0, 5000, 0.006, 9000, 0.008]
  lambda_edge_face: [0.0, 5000, 0.012, 9000, 0.025]
  lambda_l1_shoulder_arm: [0.0, 4000, 0.06, 9000, 0.09]
  lambda_edge_shoulder_arm: [0.0, 6000, 0.015, 10000, 0.035]
  boundary_band_width: 7
  face_region_min_pixels: 48
  face_perceptual_crop_pad: 12
  shoulder_arm_region_min_pixels: 96
  lambda_perceptual: [0.006, 6000, 0.008, 10000, 0.009]
  perceptual_crop_pad: 16

  mask_loss_type: l1
  lambda_mask: [0.10, 10000, 0.09]
  lambda_mask_boundary: [0.04, 6000, 0.08, 10000, 0.12]
  lambda_mask_boundary_hard: 0.0
  lambda_silhouette_outer: 0.0
  lambda_silhouette_inner: 0.0
  lambda_opacity: 0.0

  lambda_skinning: [10, 1000, 0.1]
  lambda_pose: 0.0
  lambda_aiap_xyz: 1.0
  lambda_aiap_cov: 100.0
  aiap_interval: 20
  aiap_max_points: 16000

  percent_dense: 0.01
  densification_interval: 100
  opacity_reset_interval: 3000
  densify_from_iter: 500
  densify_until_iter: 11000
  densify_grad_threshold: 0.0002
  opacity_threshold: 0.05

test_interval: 1000
save_iterations: [20000]

# @package _global_

# v170d: stronger coupled boundary head + residual actuator. This intentionally
# tests whether v170a needs more geometry leverage, while keeping densify and
# broad owner growth disabled.

model:
  texture:
    structured_trunk:
      output_head:
        local_color:
          owner:
            head:
              boundary:
                focus_source: boundary_tag
                focus_use_region_gate: false
                focus_use_support: false
                focus_threshold: 0.0
                scale: [0.48, 1, 0.76, 700, 1.00, 1600, 1.08, 2500, 1.10]
                gate_gain: 1.18
                gate_bias: 0.05
                min_gate: 0.12
                init_scale: 0.62
                takeover:
                  enable: true
                  scale: [0.26, 1, 0.46, 700, 0.64, 1600, 0.72, 2500, 0.76]
                  max: 0.76
                  use_region_gate: false

opt:
  iterations: 2500
  texture_lr: 0.00024
  grad_clip: 0.024

  boundary_signed_mixed_loss_scale: 0.12
  boundary_signed_shrink_loss_scale: 1.55
  boundary_signed_grow_loss_scale: 0.22
  boundary_signed_share_gain: 1.10
  boundary_signed_share_power: 1.20
  boundary_signed_shrink_share_gain: 1.34
  boundary_signed_shrink_share_power: 1.48

  boundary_aware_boundary_opacity_residual_scale: 0.92
  boundary_aware_boundary_scaling_residual_scale: 0.56
  boundary_opacity_residual_lr: 0.00024
  boundary_scaling_residual_lr: 0.000080

  lambda_silhouette_outer_shell: [0.018, 1, 0.038, 700, 0.046, 1800, 0.048]
  lambda_silhouette_upper_torso_outer_shell: [0.016, 1, 0.038, 700, 0.048, 1800, 0.050]
  lambda_silhouette_shoulder_arm_outer_shell: [0.012, 1, 0.030, 700, 0.040, 1800, 0.042]

test_interval: 500
test_iterations: [500, 1000, 1500, 2000, 2500]
save_iterations: [500, 1000, 1500, 2000, 2500]
checkpoint_iterations: [500, 1000, 1500, 2000, 2500]

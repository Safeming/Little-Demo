# @package _global_

# v146c: signed contour polish on top of the early/fresh hybrid trunk.
# Resume from v146b's 12k checkpoint, keep the hybrid forward trunk active,
# disable densify, and use signed boundary polish only as a late-stage refine.

best_metric: lpips_fg
best_metric_mode: min

resume:
  disable_densify_on_resume: true
  disable_opacity_reset_on_resume: true
  use_checkpoint_iteration_as_offset: false
  allow_partial_converter_load: true
  partial_converter_missing_keys_allow_patterns:
    - deformer.rigid.hybrid_field_mlp
  clear_boundary_tags_on_resume: true
  clear_binding_state_on_resume: true

model:
  deformer:
    rigid:
      hybrid_field_enable: true
      hybrid_field_anchor_enable: true
      hybrid_field_support_enable: true
      hybrid_field_update_dominant_joint: true
      hybrid_field_feature_detach: false
      hybrid_field_detach_gate: false
      hybrid_field_gate_mode: softfree
      hybrid_field_gate_min: 0.25
      hybrid_anchor_delta_scale: 0.14
      hybrid_anchor_delta_max: 0.22
      hybrid_support_scale: 0.0060
      hybrid_support_max: 0.0120
      hybrid_support_tangent_scale: 1.0
      hybrid_support_normal_scale: 0.75
      hybrid_field_mlp:
        n_neurons: 128
        n_hidden_layers: 4
        multires: 0
        skip_in: []
        cond_in: []
        last_layer_init: true

opt:
  iterations: 6000

  rigid_lr: 0.00006
  non_rigid_lr: 0.0

  percent_dense: 0.0
  densification_interval: 100
  opacity_reset_interval: 1000000
  densify_from_iter: 1000000
  densify_until_iter: 0
  densify_grad_threshold: 1.0

  boundary_region_source: soft_alpha
  boundary_target_mask_source: soft
  boundary_aware_enable: true
  boundary_aware_threshold: 0.05
  boundary_aware_score_power: 1.0
  boundary_aware_freeze_converter_for_boundary_loss: false

  boundary_image_error_score_enable: true
  boundary_image_error_score_signed_enable: true
  boundary_signed_routing_enable: true
  boundary_tag_schedule_use_local_iteration: true

  boundary_tag_enable: true
  boundary_tag_update_interval: 40
  boundary_tag_update_until_iter: 2500
  boundary_tag_threshold: 0.42
  boundary_tag_min_ratio: 0.04
  boundary_tag_binary: true
  boundary_tag_use_score_within_subset: true
  boundary_tag_score_smooth_blend: 0.20
  boundary_tag_score_smooth_k: 12
  boundary_tag_support_k: 8
  boundary_tag_support_threshold: 0.24

  boundary_band_width: 4
  boundary_image_error_score_band_width: 4
  boundary_image_error_score_focus_dilate: 2
  boundary_image_error_score_smooth_blend: 0.12
  boundary_image_error_score_prior_floor: 0.12

  boundary_signed_mixed_loss_scale: 0.12
  boundary_signed_shrink_loss_scale: 1.80
  boundary_signed_grow_loss_scale: 0.65
  boundary_signed_share_gain: 1.10
  boundary_signed_share_power: 1.30
  boundary_signed_shrink_share_gain: 1.40
  boundary_signed_shrink_share_power: 1.55

  boundary_aware_opacity_scale: 0.18
  boundary_aware_scaling_scale: 0.06
  boundary_aware_boundary_opacity_residual_scale: 1.20
  boundary_aware_boundary_scaling_residual_scale: 0.85

  boundary_opacity_residual_lr: 0.00022
  boundary_scaling_residual_lr: 0.00008
  lambda_boundary_opacity_residual_reg: 0.0008
  lambda_boundary_scaling_residual_reg: 0.0002
  lambda_boundary_opacity_residual_smooth: 0.0010
  lambda_boundary_scaling_residual_smooth: 0.0008
  boundary_residual_smooth_k: 10
  boundary_residual_smooth_distance_quantile: 0.50

  lambda_binding_hybrid_anchor_reg: 0.0012
  lambda_binding_hybrid_support_reg: 0.0020

test_interval: 1000
test_iterations: [1000, 2000, 4000, 6000]
save_iterations: [6000]

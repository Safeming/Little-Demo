# @package _global_

# v170b: same tag-driven boundary focus as v170a, but include local color output
# as an input so the boundary head can produce visible color/detail instead of
# only a tiny residual copied from the local-color input prefix.

model:
  texture:
    structured_trunk:
      output_head:
        local_color:
          owner:
            head:
              boundary:
                focus_source: boundary_tag
                focus_use_region_gate: false
                focus_use_support: false
                use_local_color_output: true
                local_color_output_scale: 0.35
                focus_threshold: 0.0
                focus_power: 1.0
                scale: [0.32, 1, 0.54, 600, 0.76, 1400, 0.84, 2000, 0.88]
                gate_gain: 1.10
                gate_bias: 0.02
                min_gate: 0.08
                init_scale: 0.42
                takeover:
                  enable: true
                  scale: [0.18, 1, 0.32, 600, 0.44, 1400, 0.50, 2000, 0.54]
                  max: 0.56
                  use_region_gate: false

opt:
  iterations: 2000
  texture_lr: 0.00022
  grad_clip: 0.026

  boundary_aware_boundary_opacity_residual_scale: 0.50
  boundary_aware_boundary_scaling_residual_scale: 0.32
  boundary_opacity_residual_lr: 0.00014
  boundary_scaling_residual_lr: 0.000048

test_interval: 500
test_iterations: [500, 1000, 1500, 2000]
save_iterations: [500, 1000, 1500, 2000]
checkpoint_iterations: [500, 1000, 1500, 2000]

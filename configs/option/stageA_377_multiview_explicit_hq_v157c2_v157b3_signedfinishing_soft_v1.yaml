# @package _global_

# v157c2: softer signed finishing on top of v157b3.
# Hypothesis from v157c1@500:
# - support/owner are stable
# - but strong signed residual finishing is not yet converting into a metric gain
# So this variant keeps more of the learned B-stage sharpness and tests whether
# C1 is simply over-driving the boundary actuator too hard.

best_metric: lpips_fg
best_metric_mode: min

resume:
  disable_densify_on_resume: true
  disable_opacity_reset_on_resume: true
  use_checkpoint_iteration_as_offset: false
  clear_boundary_tags_on_resume: true
  clear_binding_state_on_resume: true

model:
  deformer:
    non_rigid:
      delay: 600
  texture:
    structured_trunk:
      output_head:
        local_color:
          owner:
            head:
              takeover:
                strength: 1.0
              boundary:
                enable: false
    detail_residual:
      tiny_repair_scale: 0.046
      high_frequency:
        tiny_repair_scale: 0.022
        scale: 0.042
        gate_bias: -0.01
        min_gate: 0.02
        face_branch:
          enable: true
          tiny_repair_scale: 0.010
          scale: 0.16
          gate_bias: -0.03
          min_gate: 0.06

opt:
  iterations: 1500

  grad_clip: 0.032

  position_lr_init: 0.000006
  position_lr_final: 0.0000010
  opacity_lr: 0.0010
  scaling_lr: 0.00012
  rotation_lr: 0.00003

  rigid_lr: 0.00005
  non_rigid_lr: 0.00025
  texture_lr: 0.00026
  tex_latent_lr: 0.00010

  owner_local_detail_boost_enable: true
  owner_local_detail_boost_warmup_iters: 1
  owner_local_detail_boost_takeover_floor: 0.28
  owner_local_detail_boost_takeover_gain: 1.14
  owner_local_detail_boost_takeover_power: 1.25

  boundary_tag_update_interval: 40
  boundary_tag_update_until_iter: 1500
  boundary_tag_threshold: 0.42
  boundary_tag_score_smooth_blend: 0.16

  boundary_image_error_score_smooth_blend: 0.10

  boundary_signed_mixed_loss_scale: 0.08
  boundary_signed_shrink_loss_scale: 1.20
  boundary_signed_grow_loss_scale: 0.40
  boundary_signed_share_gain: 1.08
  boundary_signed_share_power: 1.18
  boundary_signed_shrink_share_gain: 1.20
  boundary_signed_shrink_share_power: 1.28

  boundary_aware_opacity_scale: 0.10
  boundary_aware_scaling_scale: 0.035
  boundary_aware_boundary_opacity_residual_scale: 0.55
  boundary_aware_boundary_scaling_residual_scale: 0.38

  boundary_opacity_residual_lr: 0.00014
  boundary_scaling_residual_lr: 0.00005
  lambda_boundary_opacity_residual_reg: 0.0006
  lambda_boundary_scaling_residual_reg: 0.00015
  lambda_boundary_opacity_residual_smooth: 0.0009
  lambda_boundary_scaling_residual_smooth: 0.0007

test_interval: 500
test_iterations: [500, 1000, 1500]
save_iterations: [1500]
checkpoint_iterations: [1500]

# @package _global_

# v163c: clean C stage for the fresh A->B->C curriculum.
# This is not a regrow stage.  It keeps the B-stage point set fixed, requires
# the real texture boundary head, and feeds the cached image-error boundary
# signal into texture forward before rendering.

best_metric: lpips_fg
best_metric_mode: min

resume:
  disable_densify_on_resume: true
  disable_opacity_reset_on_resume: true
  use_checkpoint_iteration_as_offset: false
  clear_boundary_tags_on_resume: true
  clear_binding_state_on_resume: true
  require_no_densify_on_resume: true

model:
  texture:
    structured_trunk:
      output_head:
        local_color:
          owner:
            head:
              boundary:
                enable: true
                scale: [0.18, 100, 0.42, 600, 0.66, 1200, 0.82, 1800, 0.92]
                gate_gain: 1.12
                gate_bias: -0.02
                min_gate: 0.05
                focus_threshold: 0.04
                focus_power: 1.05
                focus_min: 0.0
                focus_max: 1.0
                takeover:
                  enable: true
                  scale: [0.14, 100, 0.34, 600, 0.54, 1200, 0.70, 1800, 0.82]
                  max: 0.82
                  use_region_gate: true

opt:
  iterations: 2500

  percent_dense: 0.0
  densify_until_iter: 0
  densify_grad_threshold: 1.0
  opacity_reset_interval: 1000000

  boundary_live_score_cache_enable: true
  boundary_live_score_cache_require_texture_boundary_head: true
  boundary_live_score_cache_key: camera
  boundary_live_score_cache_max_entries: 32
  boundary_live_score_cache_ema: 0.65
  boundary_live_score_cache_clear_missing: true
  boundary_live_score_cache_clear_before_eval: true

  boundary_tag_mode: topk_ratio
  boundary_tag_topk_ratio: 0.10
  boundary_tag_min_ratio: 0.08
  boundary_tag_update_interval: 40
  boundary_tag_update_until_iter: 1800
  boundary_tag_binary: true
  boundary_tag_use_score_within_subset: true

  boundary_image_error_score_enable: true
  boundary_image_error_score_signed_enable: true
  boundary_signed_routing_enable: true
  boundary_tag_schedule_use_local_iteration: true

test_interval: 500
test_iterations: [500, 1000, 1500, 2000, 2500]
save_iterations: [1000, 2000, 2500]
checkpoint_iterations: [1000, 2000, 2500]

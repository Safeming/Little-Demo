# @package _global_

best_metric: psnr_fg

opt:
  iterations: 20000
  grad_clip: 0.1

  feature_lr: 7e-4
  pose_correction_lr: 0.0001
  non_rigid_lr: 7e-4

  lambda_l1: 1.0
  lambda_dssim: [0.0, 3000, 0.015]
  lambda_l1_fg: [0.12, 4000, 0.18, 9000, 0.20]
  lambda_l1_boundary: [0.0, 5000, 0.06, 10000, 0.10]
  lambda_l1_face: [0.0, 3000, 0.10, 7000, 0.14]
  lambda_perceptual_face: [0.0, 5000, 0.007, 9000, 0.010]
  lambda_edge_face: [0.0, 5000, 0.015, 9000, 0.035]
  lambda_l1_shoulder_arm: [0.0, 4000, 0.07, 9000, 0.10]
  lambda_edge_shoulder_arm: [0.0, 6000, 0.02, 10000, 0.04]
  boundary_band_width: 7
  face_region_min_pixels: 48
  face_perceptual_crop_pad: 12
  shoulder_arm_region_min_pixels: 96
  lambda_perceptual: [0.007, 6000, 0.009, 10000, 0.011]
  perceptual_crop_pad: 16

  mask_loss_type: l1
  lambda_mask: [0.10, 10000, 0.08]
  lambda_mask_boundary: [0.05, 5000, 0.09, 10000, 0.13]
  lambda_mask_boundary_hard: 0.0
  lambda_silhouette_outer: 0.0
  lambda_silhouette_inner: 0.0
  lambda_opacity: 0.0

  lambda_skinning: [10, 1000, 0.1]
  lambda_pose: 0.0
  lambda_aiap_xyz: 1.0
  lambda_aiap_cov: 100.0
  aiap_interval: 20
  aiap_max_points: 14000

  percent_dense: 0.01
  densification_interval: 100
  opacity_reset_interval: 3000
  densify_from_iter: 500
  densify_until_iter: 10000
  densify_grad_threshold: 0.0002
  opacity_threshold: 0.05

test_interval: 1000
save_iterations: [20000]

# @package _global_

# v1220: complete explicit_binding's structured trunk color path. Promote the
# trunk output head from a capped residual into a gated color-logit path, keep
# both raw and softly gated local region carriers inside the trunk fusion, and
# demote the old detail/high-frequency branches into tiny repair only.

best_metric: lpips_fg
best_metric_mode: min

resume:
  allow_partial_converter_load: true
  partial_converter_missing_keys_allow_patterns:
    - texture.structured_trunk_

model:
  texture:
    structured_trunk:
      output_head:
        enable: true
        mode: rgb
        compose_mode: gated_color
        disable_input_residual: true
        component_dim: 96
        use_base_input: true
        use_shared: true
        use_structure: true
        use_local: true
        use_local_raw_feature: true
        use_local_gated_feature: true
        use_local_gate_feature: true
        local_soft_gate_min: 0.08
        scale: 1.0
        gate_bias: -0.05
        min_gate: 0.02
        mlp:
          n_neurons: 128
          n_hidden_layers: 2
          multires: 0
          skip_in: []
          cond_in: []
          last_layer_init: true
        gate_mlp:
          n_neurons: 96
          n_hidden_layers: 1
          multires: 0
          skip_in: []
          cond_in: []
          last_layer_init: true
    detail_residual:
      tiny_repair_scale: 0.25
      high_frequency:
        tiny_repair_scale: 0.18
        scale: 0.14
        face_branch:
          tiny_repair_scale: 0.12
          scale: 0.03

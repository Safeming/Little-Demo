# @package _global_

# v179a: combine the two clearly positive sampling signals.
# Start from v178e best, keep K=6 same-frame accumulation, and add the stronger
# camera-quality focus that helped v178b. This keeps the conservative
# photometric base inherited from v175/v178e, but does not add the stronger
# v178c photometric correction.

best_metric: lpips_fg
best_metric_mode: min

resume:
  disable_densify_on_resume: true
  disable_opacity_reset_on_resume: true
  use_checkpoint_iteration_as_offset: true
  clear_boundary_tags_on_resume: false
  clear_binding_state_on_resume: false
  require_no_densify_on_resume: true
  allow_partial_converter_load: true

opt:
  iterations: 3000
  texture_lr: 0.000055
  grad_clip: 0.016

  train_sample_mode: frame_balanced_camera_weighted
  train_sample_accumulation_steps: 6
  train_sample_accumulation_without_replacement: true
  train_sample_camera_min_prob: 0.025
  train_sample_camera_max_prob: 0.105
  train_sample_log_interval: 500
  train_sample_camera_weights:
    "1": 1.80
    "2": 0.35
    "3": 0.85
    "4": 0.45
    "5": 1.70
    "6": 1.15
    "7": 1.25
    "8": 1.35
    "9": 1.50
    "10": 1.65
    "11": 0.70
    "12": 0.80
    "13": 1.05
    "14": 1.25
    "15": 0.70
    "16": 0.75
    "17": 0.60
    "18": 0.50
    "19": 0.90
    "20": 0.60

test_interval: 500
test_iterations: [500, 1000, 1500, 2000, 2500, 3000]
save_iterations: [500, 1000, 1500, 2000, 2500, 3000]
checkpoint_iterations: [500, 1000, 1500, 2000, 2500, 3000]

# @package _global_

# v1130: structural follow-up on top of v110b. Keep the current carrier /
# parser ROI stack unchanged and only extend the resume window while enabling
# non-rigid carry debug logs.

best_metric: lpips_fg
best_metric_mode: min

opt:
  iterations: 3600

  clarity_debug_enable: true
  clarity_debug_interval: 100
  upper_torso_region_debug_enable: true
  upper_torso_region_debug_interval: 100

model:
  deformer:
    rigid:
      non_rigid_delta_debug_interval: 100

save_iterations: [1200, 2400, 3600]
test_interval: 300

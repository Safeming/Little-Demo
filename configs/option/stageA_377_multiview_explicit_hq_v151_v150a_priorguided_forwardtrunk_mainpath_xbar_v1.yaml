# @package _global_

# v151: single-line main attack.
# Explicit binding stays as the interpretable prior, but the learned forward
# trunk becomes the real forward path:
# 1. directly drives anchor routing
# 2. directly grows support
# 3. moderately adjusts layer routing to avoid soft-path collapse
# 4. directly nudges posed x_bar in the forward pass instead of relying on
#    boundary-gated late repair

best_metric: lpips_fg
best_metric_mode: min

model:
  gaussian:
    binding_densify_boundary_only: false
    binding_densify_require_boundary_tag: false
    binding_densify_arm_only: false
    binding_densify_clone_candidate_seed_boundary_only: false
    binding_densify_clone_candidate_seed_arm_only: false
    binding_densify_child_immediate_refresh_boundary_only: false
    binding_densify_child_immediate_refresh_arm_only: false
    binding_refresh_require_boundary_tag: false
    binding_risk_gate_require_boundary_tag: false
  deformer:
    rigid:
      forward_trunk_enable: true
      forward_trunk_anchor_enable: true
      forward_trunk_support_enable: true
      forward_trunk_layer_enable: true
      forward_trunk_xbar_enable: true
      forward_trunk_update_dominant_joint: true
      forward_trunk_feature_detach: false
      forward_trunk_blend_alpha: [0.10, 200, 0.22, 700, 0.38, 1400, 0.58, 2200, 0.76, 3200, 0.90]
      forward_trunk_confidence_suppress: 0.0
      forward_trunk_output_clamp: 4.0
      forward_trunk_anchor_alpha_scale: 1.00
      forward_trunk_support_alpha_scale: 1.00
      forward_trunk_layer_alpha_scale: 0.45
      forward_trunk_xbar_alpha_scale: 0.85
      forward_trunk_anchor_logit_scale: 1.20
      forward_trunk_layer_logit_scale: 0.70
      forward_trunk_anchor_residual: true
      forward_trunk_layer_residual: true
      forward_trunk_anchor_delta_logit_max: 3.0
      forward_trunk_layer_delta_logit_max: 0.45
      forward_trunk_layer_min_prob: 0.05
      forward_trunk_support_scale: 0.0055
      forward_trunk_support_max: 0.0100
      forward_trunk_support_tangent_scale: 1.0
      forward_trunk_support_normal_scale: 0.55
      forward_trunk_xbar_scale: 0.0030
      forward_trunk_xbar_max: 0.0060
      forward_trunk_xbar_tangent_scale: 1.0
      forward_trunk_xbar_normal_scale: 0.65

      hybrid_field_enable: false
      hybrid_field_anchor_enable: false
      hybrid_field_support_enable: false
      hybrid_field_layer_enable: false

      residual_field_enable: false
      residual_field_anchor_enable: false
      residual_field_xbar_enable: false

      forward_trunk_mlp:
        n_neurons: 128
        n_hidden_layers: 4
        multires: 0
        skip_in: []
        cond_in: []
        last_layer_init: true

  texture:
    structured_trunk:
      output_head:
        local_color:
          owner:
            head:
              takeover:
                strength: [0.0, 4000, 0.0]
    detail_residual:
      tiny_repair_scale: 0.05
      high_frequency:
        tiny_repair_scale: 0.02
        scale: 0.02
        face_branch:
          tiny_repair_scale: 0.0
          scale: 0.0

opt:
  iterations: 4000

  grad_clip: 0.03
  rigid_lr: 0.00009
  non_rigid_lr: 0.00070

  percent_dense: 0.012
  densification_interval: 100
  opacity_reset_interval: 1000000
  densify_from_iter: 300
  densify_until_iter: 3600
  densify_grad_threshold: 0.00016

  owner_local_detail_boost_enable: false

  lambda_binding_forward_trunk_anchor_reg: 0.0016
  lambda_binding_forward_trunk_support_reg: 0.0020
  lambda_binding_forward_trunk_layer_reg: 0.0016
  lambda_binding_forward_trunk_xbar_reg: 0.0010
  lambda_binding_layer_balance: 0.030

test_interval: 500
test_iterations: [500, 1000, 1500, 2000, 3000, 4000]
save_iterations: [2000, 4000]
checkpoint_iterations: [2000, 4000]

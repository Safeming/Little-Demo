# @package _global_

# Structural face-detail follow-up on top of v103b:
# keep the proven shared luma/chroma carrier intact, but allow a new face
# branch to be partially loaded and warm-started from already-trained
# high-frequency modules instead of learning from a cold random init.

best_metric: lpips_fg
best_metric_mode: min

resume:
  disable_densify_on_resume: true
  disable_opacity_reset_on_resume: true
  use_checkpoint_iteration_as_offset: true
  allow_partial_converter_load: true
  partial_converter_missing_keys_allow_patterns:
    - texture.detail_high_freq_face_

opt:
  iterations: 3000
  latent_weight_decay: [0.0008, 1000, 0.0004, 2200, 0.0002]

  face_region_source: parser_prefer
  face_region_parser_dilate: 5
  face_region_source_aware_validity_enable: true

  face_detail_boundary_keep_width: 0
  face_detail_boundary_keep_weight: 0.0
  shoulder_arm_detail_boundary_keep_width: 0
  shoulder_arm_detail_boundary_keep_weight: 0.0
  waist_detail_boundary_keep_width: 0
  waist_detail_boundary_keep_weight: 0.0

  lambda_detail_face_luma_dog: 0.058
  lambda_perceptual_face_patch: 0.036
  lambda_perceptual_shoulder_arm_patch: 0.010

  face_patch_perceptual_topk: 3
  face_patch_perceptual_focus_power: 1.55
  face_patch_perceptual_error_mix: 0.74

  clarity_debug_enable: true
  clarity_debug_interval: 100

model:
  texture:
    detail_residual:
      high_frequency:
        face_branch:
          enable: true
          gate_init_from: gate_mlp
          init_missing_only: true
          point_gate:
            enable: true
            semantic_id_weights:
              - [1, 1.00]
              - [2, 0.98]
              - [3, 0.22]
            joint_id_weights:
              - [15, 1.00]
              - [12, 1.00]
              - [13, 0.98]
              - [14, 0.98]
              - [16, 0.44]
              - [17, 0.44]
              - [18, 0.10]
              - [19, 0.10]
            min_gate: 0.22

save_iterations: [1200, 2400, 3000]

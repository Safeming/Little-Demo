# @package _global_

best_metric: psnr_fg

resume:
  disable_densify_on_resume: false
  disable_opacity_reset_on_resume: false
  use_checkpoint_iteration_as_offset: false

opt:
  iterations: 15000
  grad_clip: 0.1

  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 30000
  feature_lr: 0.001
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001

  pose_correction_lr: 0.0001
  rigid_lr: 0.0
  non_rigid_lr: 0.001
  lr_ratio: 0.1

  lambda_l1: 1.0
  lambda_dssim: 0.0
  lambda_perceptual: 0.01
  mask_loss_type: l1
  lambda_mask: 0.1
  lambda_opacity: 0.0
  lambda_skinning: [10, 1000, 0.1]
  lambda_pose: 0.0
  lambda_aiap_xyz: 1.0
  lambda_aiap_cov: 100.0

  percent_dense: 0.01
  densification_interval: 100
  opacity_reset_interval: 3000
  densify_from_iter: 500
  densify_until_iter: 10000
  densify_grad_threshold: 0.0002
  opacity_threshold: 0.05

test_interval: 1000
save_iterations: [15000]

# @package _global_

# v139a: stop relying on detached binding boundary prior alone.
# Mix boundary prior with actual opacity-vs-GT contour disagreement sampled back
# to points, then use that score to drive boundary tags, boundary-aware
# backward, and the boundary opacity/scaling residual route.

opt:
  boundary_region_source: soft_alpha
  boundary_target_mask_source: soft
  boundary_band_width: 5
  lambda_l1_boundary: 0.024
  lambda_mask_boundary: 0.028
  lambda_mask_boundary_hard: 0.010
  lambda_silhouette_outer: 0.008
  lambda_silhouette_outer_shell: 0.012
  silhouette_outer_ring_width: 3
  silhouette_outer_shell_start_width: 3
  silhouette_outer_shell_end_width: 9
  silhouette_outer_shell_soft_weights: true
  silhouette_outer_shell_weight_min: 0.25

  boundary_aware_enable: true
  boundary_aware_threshold: 0.05
  boundary_aware_score_power: 1.0
  boundary_aware_opacity_scale: 0.22
  boundary_aware_scaling_scale: 0.08
  boundary_aware_boundary_opacity_residual_scale: 1.00
  boundary_aware_boundary_scaling_residual_scale: 0.60

  boundary_opacity_residual_lr: 0.00025
  boundary_scaling_residual_lr: 0.00008
  lambda_boundary_opacity_residual_reg: 0.0010
  lambda_boundary_scaling_residual_reg: 0.0003
  lambda_boundary_opacity_residual_smooth: 0.0014
  lambda_boundary_scaling_residual_smooth: 0.0012
  boundary_residual_smooth_k: 10
  boundary_residual_smooth_distance_quantile: 0.50

  boundary_image_error_score_enable: true
  boundary_image_error_score_mix: [0.35, 400, 0.55, 1400, 0.72, 2600, 0.82, 3400, 0.88]
  boundary_image_error_score_gain: 1.20
  boundary_image_error_score_power: 1.10
  boundary_image_error_score_min: 0.04
  boundary_image_error_score_band_width: 5
  boundary_image_error_pred_threshold: 0.42
  boundary_image_error_target_threshold: 0.50
  boundary_image_error_score_focus_dilate: 3
  boundary_image_error_score_smooth_k: 8
  boundary_image_error_score_smooth_blend: 0.30
  boundary_image_error_score_smooth_distance_quantile: 0.50
  boundary_image_error_score_prior_floor: 0.18

  boundary_tag_enable: true
  boundary_tag_update_interval: 50
  boundary_tag_update_until_iter: 800
  boundary_tag_threshold: 0.42
  boundary_tag_min_ratio: 0.04
  boundary_tag_binary: false
  boundary_tag_use_score_within_subset: true
  boundary_tag_score_smooth_blend: 0.35
  boundary_tag_support_threshold: 0.28

  detail_interior_exclude_boundary_width: 3
  detail_boundary_keep_weight: 0.20
  face_detail_boundary_keep_weight: 0.25
  shoulder_arm_detail_boundary_keep_weight: 0.30
  upper_torso_detail_boundary_keep_weight: 0.30

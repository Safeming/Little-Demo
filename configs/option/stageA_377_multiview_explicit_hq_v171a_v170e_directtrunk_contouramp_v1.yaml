# @package _global_

# v171a: enter the trunk-HF mainline from v170e.
#
# v170 fixed boundary focus routing but the visible boundary/head output stayed
# too small. This run unfreezes the direct trunk output heads and keeps geometry
# frozen, so the test is whether appearance/contour residual amplitude can grow
# without washing out the v142e/v170e clarity anchor.

best_metric: lpips_fg
best_metric_mode: min

resume:
  disable_densify_on_resume: true
  disable_opacity_reset_on_resume: true
  use_checkpoint_iteration_as_offset: true
  clear_boundary_tags_on_resume: true
  clear_binding_state_on_resume: false
  require_no_densify_on_resume: true

model:
  texture:
    structured_trunk:
      output_head:
        scale: 1.08
        gate_gain: 1.38
        gate_bias: -0.06
        min_gate: 0.02
        max_gate: 0.72
        local_color:
          scale: 1.34
          owner:
            head:
              scale: 0.82
              local_color_output_scale: 0.24
              gate_gain: 1.10
              gate_bias: -0.04
              min_gate: 0.06
              max_gate: 0.74
              takeover:
                enable: true
                scale: 1.0
                strength: 0.92
                max: 0.92
              boundary:
                focus_source: boundary_tag
                focus_use_region_gate: false
                focus_use_support: false
                focus_threshold: 0.0
                scale: 1.28
                gate_gain: 1.18
                gate_bias: 0.08
                min_gate: 0.12
                max_gate: 0.78
                use_local_color_output: true
                local_color_output_scale: 0.42
                init_scale: 0.62
                takeover:
                  enable: true
                  scale: 1.35
                  max: 1.0
                  use_region_gate: false
        dual_head:
          base_scaffold_scale: 0.68
          coarse_scale: 0.62
          hf_head:
            enable: true
            reuse_output_gate: false
            scale: 0.66
            use_local_color: true
            local_color_scale: 1.12
            gate_gain: 1.08
            gate_bias: -0.04
            min_gate: 0.05
            max_gate: 0.70
            region_boost:
              face: 0.50
              shoulder_upper: 0.34
              upper_torso: 0.24
            region_boost_max: 2.10
          coarse_region_suppress:
            face: 0.22
            shoulder_upper: 0.16
            upper_torso: 0.10

opt:
  iterations: 2500

  # Protect the geometry anchor. Only texture output heads and contour residual
  # tensors can move in this root-cause probe.
  position_lr_init: 0.0
  position_lr_final: 0.0
  feature_lr: 0.0
  opacity_lr: 0.0
  scaling_lr: 0.0
  rotation_lr: 0.0
  rigid_lr: 0.0
  non_rigid_lr: 0.0
  pose_correction_lr: 0.0
  tex_latent_lr: 0.0

  texture_lr: 0.00016
  grad_clip: 0.020
  texture_trainable_name_patterns:
    - structured_trunk_output_head_mlp.*
    - structured_trunk_output_head_gate_mlp.*
    - structured_trunk_output_head_hf_head_mlp.*
    - structured_trunk_output_head_hf_head_gate_mlp.*
    - structured_trunk_output_head_local_color_mlps.*
    - structured_trunk_output_head_local_color_owner_head_mlps.*
    - structured_trunk_output_head_local_color_owner_head_gate_mlps.*
    - structured_trunk_output_head_local_color_owner_head_boundary_mlps.*
    - structured_trunk_output_head_local_color_owner_head_boundary_gate_mlps.*
  texture_frozen_name_patterns: null

  percent_dense: 0.0
  densify_from_iter: 1000000
  densify_until_iter: 0
  opacity_reset_interval: 1000000

  boundary_tag_mode: topk_ratio
  boundary_tag_topk_ratio: 0.10
  boundary_tag_min_ratio: 0.06
  boundary_tag_update_interval: 40
  boundary_tag_update_until_iter: 1600
  boundary_tag_binary: true
  boundary_tag_use_score_within_subset: true
  boundary_tag_union_with_existing: false

  photometric_correction_enable: true
  photometric_correction_strength: 0.42
  photometric_correction_erode_kernel_size: 9
  photometric_correction_min_pixels: 512
  photometric_correction_min_scale: 0.82
  photometric_correction_max_scale: 1.20
  photometric_correction_max_shift: 0.080
  photometric_contour_debug_interval: 500

  contour_uncertainty_enable: true
  contour_uncertainty_band_width: 9
  contour_uncertainty_outer_width: 6
  contour_uncertainty_min_weight: 0.52

  boundary_aware_boundary_opacity_residual_scale: 0.82
  boundary_aware_boundary_scaling_residual_scale: 0.50
  boundary_opacity_residual_lr: 0.00020
  boundary_scaling_residual_lr: 0.000068
  lambda_boundary_opacity_residual_reg: 0.00075
  lambda_boundary_scaling_residual_reg: 0.00018
  lambda_boundary_opacity_residual_smooth: 0.0010
  lambda_boundary_scaling_residual_smooth: 0.00070

  lambda_silhouette_outer: [0.005, 1, 0.008]
  lambda_silhouette_outer_shell: [0.018, 1, 0.038]
  lambda_silhouette_upper_torso_outer_shell: [0.016, 1, 0.040]
  lambda_silhouette_shoulder_arm_outer_shell: [0.012, 1, 0.034]

test_interval: 500
test_iterations: [500, 1000, 1500, 2000, 2500]
save_iterations: [500, 1000, 1500, 2000, 2500]
checkpoint_iterations: [500, 1000, 1500, 2000, 2500]

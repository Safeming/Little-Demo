# @package _global_

# v178a: K=4 low-LR stabilization from v177a best.
# v177a improved until local 3000 and then regressed slightly by 4000. This run
# tests whether a smaller texture LR can keep the K=4 gain moving without
# overshooting.

best_metric: lpips_fg
best_metric_mode: min

resume:
  disable_densify_on_resume: true
  disable_opacity_reset_on_resume: true
  use_checkpoint_iteration_as_offset: true
  clear_boundary_tags_on_resume: false
  clear_binding_state_on_resume: false
  require_no_densify_on_resume: true
  allow_partial_converter_load: true

opt:
  iterations: 3000
  texture_lr: 0.000075
  grad_clip: 0.018

  train_sample_mode: frame_balanced_camera_weighted
  train_sample_accumulation_steps: 4
  train_sample_accumulation_without_replacement: true
  train_sample_log_interval: 500

test_interval: 750
test_iterations: [750, 1500, 2250, 3000]
save_iterations: [750, 1500, 2250, 3000]
checkpoint_iterations: [750, 1500, 2250, 3000]

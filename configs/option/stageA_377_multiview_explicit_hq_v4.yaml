# @package _global_

best_metric: psnr_fg

resume:
  disable_densify_on_resume: false
  disable_opacity_reset_on_resume: false
  use_checkpoint_iteration_as_offset: false

opt:
  iterations: 15000
  grad_clip: 0.1

  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 30000
  feature_lr: 0.001
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001

  pose_correction_lr: 0.0001
  rigid_lr: 0.0
  non_rigid_lr: 0.001
  lr_ratio: 0.1

  lambda_l1: 1.0
  lambda_l1_fg: 0.20
  lambda_l1_boundary: 0.12
  lambda_l1_face: 0.18
  lambda_perceptual_face: 0.015
  lambda_l1_shoulder_arm: 0.14
  lambda_edge_shoulder_arm: 0.08
  boundary_band_width: 7
  face_region_min_pixels: 48
  face_perceptual_crop_pad: 12
  shoulder_arm_region_min_pixels: 96
  lambda_dssim: 0.0
  lambda_perceptual: 0.01
  perceptual_crop_pad: 16
  mask_loss_type: l1
  lambda_mask: 0.1
  lambda_mask_boundary: 0.20
  lambda_opacity: 0.0
  lambda_skinning: [10, 1000, 0.1]
  lambda_pose: 0.0
  lambda_aiap_xyz: 1.0
  lambda_aiap_cov: 100.0
  aiap_interval: 10
  aiap_max_points: 20000

  percent_dense: 0.01
  densification_interval: 100
  opacity_reset_interval: 3000
  densify_from_iter: 500
  densify_until_iter: 12000
  densify_grad_threshold: 0.0002
  opacity_threshold: 0.05

test_interval: 1000
save_iterations: [15000]

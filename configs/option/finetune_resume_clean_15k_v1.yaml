# @package _global_

resume:
  disable_densify_on_resume: false
  disable_opacity_reset_on_resume: true
  use_checkpoint_iteration_as_offset: true

opt:
  iterations: 15000
  densify_from_iter: 3200
  densify_until_iter: 9000
  densification_interval: 200
  densify_grad_threshold: 0.00035
  percent_dense: 0.003
  opacity_reset_interval: 1000000
  lambda_mask: 0.15

test_interval: 500
save_iterations: [15000]

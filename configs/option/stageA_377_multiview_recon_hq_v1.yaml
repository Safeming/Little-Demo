# @package _global_

best_metric: psnr_fg

resume:
  disable_densify_on_resume: false
  disable_opacity_reset_on_resume: false
  use_checkpoint_iteration_as_offset: false

opt:
  # From-scratch multiview reconstruction should first focus on image quality.
  iterations: 15000

  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  feature_lr: 0.0020
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  rigid_lr: 0.0
  non_rigid_lr: 0.001
  texture_lr: 0.001

  lambda_l1: 1.0
  lambda_dssim: 0.0
  lambda_perceptual: 0.01
  mask_loss_type: l1
  lambda_mask: 0.10

  # Let geometry grow from scratch instead of trying to fix it afterwards.
  densify_from_iter: 500
  densify_until_iter: 10000
  densification_interval: 100
  densify_grad_threshold: 0.0002
  percent_dense: 0.01
  opacity_reset_interval: 3000

test_interval: 500
save_iterations: [15000]

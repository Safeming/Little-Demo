# @package _global_

# v170a: fix v169a's diluted boundary focus by driving the boundary head from
# the already-narrow 8% boundary tag instead of the mixed score.

model:
  texture:
    structured_trunk:
      output_head:
        local_color:
          owner:
            head:
              boundary:
                focus_source: boundary_tag
                focus_use_region_gate: false
                focus_use_support: false
                focus_threshold: 0.0
                focus_power: 1.0
                scale: [0.42, 1, 0.70, 600, 0.90, 1400, 0.96, 2000, 1.00]
                gate_gain: 1.16
                gate_bias: 0.04
                min_gate: 0.10
                init_scale: 0.55
                takeover:
                  enable: true
                  scale: [0.22, 1, 0.38, 600, 0.52, 1400, 0.58, 2000, 0.62]
                  max: 0.62
                  use_region_gate: false

opt:
  iterations: 2000
  texture_lr: 0.00026
  grad_clip: 0.026

  boundary_aware_boundary_opacity_residual_scale: 0.55
  boundary_aware_boundary_scaling_residual_scale: 0.34
  boundary_opacity_residual_lr: 0.00015
  boundary_scaling_residual_lr: 0.000050

test_interval: 500
test_iterations: [500, 1000, 1500, 2000]
save_iterations: [500, 1000, 1500, 2000]
checkpoint_iterations: [500, 1000, 1500, 2000]

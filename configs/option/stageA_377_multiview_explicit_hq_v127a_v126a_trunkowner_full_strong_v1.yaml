# @package _global_

# v127a: stronger ownership version. Push more region-aware hf gain and more
# coarse suppression to see whether the remaining softness is mostly because
# the mainline still does not own enough of face / shoulder detail.

model:
  texture:
    structured_trunk:
      output_head:
        dual_head:
          coarse_region_suppress:
            face: 0.18
            shoulder_upper: 0.12
            upper_torso: 0.08
          coarse_region_min_scale: 0.60
          hf_head:
            gate_gain: 1.12
            gate_bias: -0.02
            min_gate: 0.05
            scale: [0.18, 600, 0.26, 1800, 0.36, 3200, 0.48]
            region_boost:
              face: 0.40
              shoulder_upper: 0.24
              upper_torso: 0.16
            region_boost_max: 1.90
    detail_residual:
      tiny_repair_scale: 0.08
      high_frequency:
        tiny_repair_scale: 0.04
        scale: 0.035
        face_branch:
          tiny_repair_scale: 0.0
          scale: 0.0

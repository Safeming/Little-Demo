# @package _global_

# v1330: complete the explicit_binding trunk-owner route. Replace the old
# "local_color as a post-hoc add-on" behavior with a real owner high-frequency
# head inside the trunk. The owner head consumes the local-color seed, current
# xyz/radius raw geometry, and soft support as features, so explicit_binding's
# main trunk can generate high-frequency color itself instead of relying on a
# late residual-style owner add.

model:
  texture:
    structured_trunk:
      output_head:
        local_color:
          owner:
            enable: true
            use_support: true
            use_region_gate: false
            gate_base: 0.0
            scale: [0.20, 600, 0.32, 1800, 0.48, 3200, 0.70]
            head:
              enable: true
              scale: [0.20, 600, 0.32, 1800, 0.48, 3200, 0.70]
              use_local_color_input: true
              use_local_color_output: true
              use_local_geometry_raw: true
              use_support_feature: true
              use_region_gate_feature: false
              init_from_local_color: true
              init_scale: 0.60
              gate_gain: 1.16
              gate_bias: -0.02
              min_gate: 0.08
              mlp:
                n_neurons: 128
                n_hidden_layers: 2
                multires: 0
                skip_in: []
                cond_in: []
                last_layer_init: true
              gate_mlp:
                n_neurons: 96
                n_hidden_layers: 1
                multires: 0
                skip_in: []
                cond_in: []
                last_layer_init: true
        dual_head:
          hf_head:
            use_local_color: false

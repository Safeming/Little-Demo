# @package _global_

# v158a: resume from v157b3 and keep the stable mid-handoff geometry/owner base,
# but explicitly restore edge/boundary carry that v157c2 still lacked.
#
# Goal:
# - keep v157b3's support/owner stability
# - bring back owner-aware edge/boundary supervision from the v156a probe
# - force detail supervision to keep touching the boundary band instead of
#   only rewarding interior texture recovery
#
# Success signals by 1k~1.5k:
# - ClarityOwnerBoost edge / boundary scales leave the 1.0 regime
# - shoulder / torso boundary hard losses stay active instead of collapsing
# - render tightens shoulder / tank-top / forearm / shoe boundaries without
#   the large quality drop seen in the earlier aggressive sharp probe

best_metric: lpips_fg
best_metric_mode: min

resume:
  disable_densify_on_resume: true
  disable_opacity_reset_on_resume: true
  use_checkpoint_iteration_as_offset: false
  clear_boundary_tags_on_resume: true
  clear_binding_state_on_resume: true

model:
  texture:
    structured_trunk:
      output_head:
        local_color:
          owner:
            head:
              boundary:
                enable: true
                scale: [0.10, 150, 0.28, 800, 0.50, 1600, 0.72, 2400, 0.88, 3000, 1.00]
                gate_gain: 1.10
                gate_bias: -0.03
                min_gate: 0.05
                use_local_color_input: true
                use_local_color_output: false
                use_local_geometry_raw: true
                use_support_feature: true
                use_region_gate_feature: true
                use_boundary_feature: true
                focus_threshold: 0.12
                focus_power: 1.30
                focus_min: 0.0
                focus_max: 1.0
                focus_use_region_gate: true
                focus_use_support: true
                focus_support_detach: true
                init_from_local_color: true
                init_scale: 0.18
                takeover:
                  enable: true
                  scale: [0.08, 150, 0.24, 800, 0.44, 1600, 0.66, 2400, 0.82, 3000, 0.92]
                  max: 0.85
                  use_region_gate: true
    detail_residual:
      tiny_repair_scale: 0.044
      high_frequency:
        tiny_repair_scale: 0.018
        scale: 0.046
        gate_bias: -0.03
        face_branch:
          gate_bias: -0.06

opt:
  iterations: 3000

  grad_clip: 0.036

  rigid_lr: 0.000065
  non_rigid_lr: 0.00038
  texture_lr: 0.00034
  tex_latent_lr: 0.00015

  lambda_edge_face: 0.034
  lambda_edge_shoulder_arm: 0.058
  lambda_detail_face_luma_dog: 0.072
  lambda_detail_shoulder_arm_luma_dog: 0.050
  lambda_perceptual_shoulder_arm_patch: 0.015
  lambda_detail_upper_torso_luma_dog: 0.027
  lambda_perceptual_upper_torso_patch: 0.012
  lambda_mask_shoulder_arm_boundary_hard: 0.016
  lambda_mask_upper_torso_boundary_hard: 0.012

  face_detail_boundary_keep_width: 3
  face_detail_boundary_keep_weight: 0.25
  shoulder_arm_detail_boundary_keep_width: 4
  shoulder_arm_detail_boundary_keep_weight: 0.35
  upper_torso_detail_boundary_keep_width: 3
  upper_torso_detail_boundary_keep_weight: 0.30

  owner_local_detail_boost_enable: true
  owner_local_detail_boost_warmup_iters: 100
  owner_local_detail_boost_takeover_floor: 0.22
  owner_local_detail_boost_takeover_gain: 1.18
  owner_local_detail_boost_takeover_power: 1.28
  owner_local_detail_boost_min_signal: 0.05
  owner_local_detail_boost_detail_max_extra: [0.22, 600, 0.60, 1400, 1.00, 2600, 1.30, 3400, 1.55]
  owner_local_detail_boost_luma_max_extra: [0.34, 600, 0.95, 1400, 1.45, 2600, 1.90, 3400, 2.12]
  owner_local_detail_boost_patch_max_extra: [0.24, 600, 0.68, 1400, 1.05, 2600, 1.34, 3400, 1.58]
  owner_local_detail_boost_edge_max_extra: [0.10, 200, 0.30, 800, 0.55, 1600, 0.80, 2400, 0.95, 3000, 1.05]
  owner_local_detail_boost_boundary_max_extra: [0.08, 200, 0.24, 800, 0.45, 1600, 0.68, 2400, 0.82, 3000, 0.95]
  owner_local_detail_boost_face_strength: 1.00
  owner_local_detail_boost_shoulder_strength: 0.96
  owner_local_detail_boost_upper_torso_strength: 0.90
  owner_local_detail_boost_upper_torso_core_strength: 1.00
  owner_local_detail_boost_face_edge_strength: 1.04
  owner_local_detail_boost_shoulder_edge_strength: 1.10
  owner_local_detail_boost_shoulder_boundary_strength: 1.10
  owner_local_detail_boost_upper_torso_boundary_strength: 1.00

  boundary_tag_update_interval: 50
  boundary_tag_update_until_iter: 2200
  boundary_tag_threshold: 0.42

  boundary_image_error_score_smooth_blend: 0.10
  boundary_signed_mixed_loss_scale: 0.06
  boundary_signed_shrink_loss_scale: 1.00
  boundary_signed_grow_loss_scale: 0.32
  boundary_signed_share_gain: 1.02
  boundary_signed_share_power: 1.10
  boundary_signed_shrink_share_gain: 1.08
  boundary_signed_shrink_share_power: 1.18

  boundary_aware_opacity_scale: 0.09
  boundary_aware_scaling_scale: 0.028
  boundary_aware_boundary_opacity_residual_scale: 0.24
  boundary_aware_boundary_scaling_residual_scale: 0.16
  boundary_opacity_residual_lr: 0.00008
  boundary_scaling_residual_lr: 0.000025

test_interval: 500
test_iterations: [500, 1000, 1500, 2000, 2500, 3000]
save_iterations: [1500, 3000]
checkpoint_iterations: [1500, 3000]

# @package _global_

# v145a: explicit prior-guided learned forward trunk.
# Keep explicit binding as the interpretable prior, then learn a global
# anchor-logit correction branch that directly drives the forward transform.
# This isolates whether "learned forward skinning on top of explicit prior"
# can recover clarity without falling back to boundary-only repair.

best_metric: lpips_fg
best_metric_mode: min

resume:
  disable_densify_on_resume: true
  disable_opacity_reset_on_resume: true
  use_checkpoint_iteration_as_offset: false
  clear_boundary_tags_on_resume: true
  clear_binding_state_on_resume: true
  allow_partial_converter_load: true
  partial_converter_missing_keys_allow_patterns:
    - deformer.rigid.hybrid_field_mlp

model:
  deformer:
    rigid:
      hybrid_field_enable: true
      hybrid_field_anchor_enable: true
      hybrid_field_support_enable: false
      hybrid_field_update_dominant_joint: true
      hybrid_field_feature_detach: false
      hybrid_field_detach_gate: false
      hybrid_field_gate_mode: global
      hybrid_field_gate_min: 1.0
      hybrid_anchor_delta_scale: 0.10
      hybrid_anchor_delta_max: 0.16
      hybrid_field_mlp:
        n_neurons: 64
        n_hidden_layers: 2
        multires: 0
        skip_in: []
        cond_in: []
        last_layer_init: true

opt:
  iterations: 4000

  rigid_lr: 0.00014
  non_rigid_lr: 0.0

  boundary_aware_freeze_converter_for_boundary_loss: false

  lambda_binding_hybrid_anchor_reg: 0.0035

test_interval: 500
test_iterations: [1000, 2000, 4000]
save_iterations: [4000]

# @package _global_

# v169a: hardest-contour boundary actuator on top of the v168a/v142e clarity anchor.
#
# v168a proved that isolated trunk-HF is not the root clarity bottleneck:
# it only matched v142e while boundary/head actuator signals stayed at zero.
# This stage protects the anchor, creates a narrow boundary expert, and lets
# only that expert plus boundary opacity/scaling residuals move.

best_metric: lpips_fg
best_metric_mode: min

resume:
  disable_densify_on_resume: true
  disable_opacity_reset_on_resume: true
  use_checkpoint_iteration_as_offset: true
  clear_boundary_tags_on_resume: true
  clear_binding_state_on_resume: false
  require_no_densify_on_resume: true
  allow_partial_converter_load: true
  partial_converter_missing_keys_allow_patterns:
    - structured_trunk_output_head_local_color_owner_head_boundary

model:
  texture:
    structured_trunk:
      output_head:
        local_color:
          owner:
            head:
              boundary:
                enable: true
                scale: [0.08, 1, 0.16, 300, 0.26, 900, 0.32, 1500, 0.34]
                gate_gain: 1.06
                gate_bias: -0.02
                min_gate: 0.03
                use_local_color_input: true
                use_local_color_output: false
                use_local_geometry_raw: true
                use_support_feature: true
                use_region_gate_feature: true
                use_boundary_feature: true
                focus_threshold: 0.045
                focus_power: 1.10
                focus_min: 0.0
                focus_max: 1.0
                focus_use_region_gate: true
                focus_use_support: true
                focus_support_detach: true
                init_from_local_color: true
                init_scale: 0.16
                takeover:
                  enable: true
                  scale: [0.06, 1, 0.12, 300, 0.20, 900, 0.26, 1500, 0.28]
                  max: 0.30
                  use_region_gate: true

opt:
  iterations: 1500

  grad_clip: 0.026

  # Freeze the v168a/v142e anchor except for boundary residuals and the newly
  # introduced boundary head. This tests whether a true hardest-contour actuator
  # can improve clarity without washing out the anchor.
  position_lr_init: 0.0
  position_lr_final: 0.0
  feature_lr: 0.0
  opacity_lr: 0.0
  scaling_lr: 0.0
  rotation_lr: 0.0
  rigid_lr: 0.0
  non_rigid_lr: 0.0
  pose_correction_lr: 0.0
  tex_latent_lr: 0.0

  texture_lr: 0.00020
  texture_trainable_name_patterns:
    - structured_trunk_output_head_local_color_owner_head_boundary_mlps.*
    - structured_trunk_output_head_local_color_owner_head_boundary_gate_mlps.*

  percent_dense: 0.0
  densify_from_iter: 1000000
  densify_until_iter: 0
  densification_interval: 100
  densify_grad_threshold: 1.0
  opacity_reset_interval: 1000000
  opacity_threshold: 0.060

  boundary_live_score_cache_enable: true
  boundary_live_score_cache_require_texture_boundary_head: true
  boundary_live_score_cache_key: camera
  boundary_live_score_cache_max_entries: 32
  boundary_live_score_cache_ema: 0.70
  boundary_live_score_cache_clear_missing: true
  boundary_live_score_cache_clear_before_eval: true

  boundary_region_source: soft_alpha
  boundary_target_mask_source: soft
  boundary_aware_enable: true
  boundary_aware_threshold: 0.035
  boundary_aware_score_power: 1.0
  boundary_aware_freeze_converter_for_boundary_loss: false

  boundary_image_error_score_enable: true
  boundary_image_error_score_signed_enable: true
  boundary_signed_routing_enable: true
  boundary_tag_schedule_use_local_iteration: true

  boundary_tag_enable: true
  boundary_tag_mode: topk_ratio
  boundary_tag_topk_ratio: 0.08
  boundary_tag_min_ratio: 0.05
  boundary_tag_update_interval: 40
  boundary_tag_update_until_iter: 1200
  boundary_tag_binary: true
  boundary_tag_use_score_within_subset: true
  boundary_tag_union_with_existing: false
  boundary_tag_score_smooth_blend: 0.12
  boundary_tag_score_smooth_k: 10
  boundary_tag_support_k: 8
  boundary_tag_support_threshold: 0.24

  boundary_band_width: 5
  boundary_image_error_score_mix: [0.50, 1, 0.62, 600, 0.70, 1200, 0.72]
  boundary_image_error_score_gain: 1.06
  boundary_image_error_score_power: 1.05
  boundary_image_error_score_min: 0.030
  boundary_image_error_score_band_width: 5
  boundary_image_error_score_focus_dilate: 2
  boundary_image_error_score_smooth_k: 8
  boundary_image_error_score_smooth_blend: 0.10
  boundary_image_error_score_prior_floor: 0.10

  boundary_signed_mixed_loss_scale: 0.08
  boundary_signed_shrink_loss_scale: 1.10
  boundary_signed_grow_loss_scale: 0.26
  boundary_signed_share_gain: 1.04
  boundary_signed_share_power: 1.14
  boundary_signed_shrink_share_gain: 1.16
  boundary_signed_shrink_share_power: 1.28

  boundary_aware_opacity_scale: 0.10
  boundary_aware_scaling_scale: 0.032
  boundary_aware_boundary_opacity_residual_scale: 0.45
  boundary_aware_boundary_scaling_residual_scale: 0.28
  boundary_opacity_residual_lr: 0.00012
  boundary_scaling_residual_lr: 0.000040
  lambda_boundary_opacity_residual_reg: 0.00075
  lambda_boundary_scaling_residual_reg: 0.00018
  lambda_boundary_opacity_residual_smooth: 0.0010
  lambda_boundary_scaling_residual_smooth: 0.00070
  boundary_residual_smooth_k: 10
  boundary_residual_smooth_distance_quantile: 0.50

  # Mild anti-bulge pressure: enough to punish side protrusions, not enough to
  # rewrite the whole v168a silhouette.
  silhouette_outer_ring_width: 5
  silhouette_outer_shell_start_width: 1
  silhouette_outer_shell_end_width: 11
  silhouette_outer_shell_soft_weights: true
  silhouette_outer_shell_weight_min: 0.26
  lambda_silhouette_outer: [0.004, 1, 0.007, 500, 0.008]
  lambda_silhouette_outer_shell: [0.014, 1, 0.026, 500, 0.032, 1200, 0.034]
  lambda_silhouette_upper_torso_outer_shell: [0.012, 1, 0.026, 500, 0.034, 1200, 0.036]
  lambda_silhouette_shoulder_arm_outer_shell: [0.010, 1, 0.022, 500, 0.030, 1200, 0.032]

test_interval: 500
test_iterations: [500, 1000, 1500]
save_iterations: [500, 1000, 1500]
checkpoint_iterations: [500, 1000, 1500]
